<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Portal - Smart Clinic</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
        body {
          font-family: Arial, sans-serif;
          padding: 20px;
        }

        h2 {
          margin-bottom: 10px;
          color: #2a7ae2;
        }

        .form-group {
          margin-bottom: 15px;
        }

        label {
          display: block;
          margin-bottom: 5px;
          font-weight: 600;
        }

        input {
          width: 100%;
          padding: 8px;
          box-sizing: border-box;
        }

        button {
          background-color: #2a7ae2;
          color: white;
          padding: 10px 20px;
          border: none;
          cursor: pointer;
          margin-top: 10px;
        }

        .success-message {
          margin-top: 20px;
          color: green;
        }
    </style>
</head>
<body>

<h2>Admin Portal: Add Doctor</h2>

<form id="addDoctorForm">
    <div class="form-group">
        <label for="doctorName">Doctor Name</label>
        <input type="text" id="doctorName" name="doctorName" required />
    </div>

    <div class="form-group">
        <label for="specialization">Specialization</label>
        <input type="text" id="specialization" name="specialization" required />
    </div>

    <div class="form-group">
        <label for="email">Doctor Email</label>
        <input type="email" id="email" name="email" required />
    </div>

    <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required />
    </div>

    <button type="submit">Add Doctor</button>
    <div id="success" class="success-message"></div>
</form>

<script>
    document.getElementById("addDoctorForm").addEventListener("submit", function(event) {
      event.preventDefault();

      // Simulated form submission
      const doctorName = document.getElementById("doctorName").value;
      const specialization = document.getElementById("specialization").value;

      document.getElementById("success").textContent = `✅ Doctor ${doctorName} (${specialization}) added successfully!`;

      // You can integrate this with a backend POST request here
      // Example: fetch("/api/doctors", { method: "POST", body: formData });
    });
</script>

</body>
</html>
